        @import url('https://fonts.googleapis.com/css2?family=Instrument+Serif:ital@0;1&family=Inter:wght@400;500;600;700&display=swap');
        :root{
          --header-bg:#e5e5e5;
          --page-bg:#ffffff;
          --card-bg:#eeeeee;
          --card-border:#d8d8d8;
          --text:#111111;
          --muted:#555555;
          --accent:#C46A3A;
          --accent-2:#E8A07A;
          --radius-xl:28px;
          --radius-lg:18px;
          --radius-md:12px;
          --shadow-soft:0 12px 40px rgba(17,17,17,0.06), 0 2px 10px rgba(17,17,17,0.04);
          --shadow-card:0 20px 50px rgba(17,17,17,0.08);
        }
        .chamber-root.is-dark{
          --header-bg:#1b1b1b;
          --page-bg:#0f0f0f;
          --card-bg:#1e1e1e;
          --card-border:#2c2c2c;
          --text:#f5f2ed;
          --muted:#9e9a94;
          --shadow-soft:0 12px 40px rgba(0,0,0,0.35);
          --shadow-card:0 20px 50px rgba(0,0,0,0.45);
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{background:var(--page-bg)}
        .chamber-root{
          min-height:100vh;
          background:var(--page-bg);
          color:var(--text);
          font-family:"Inter", system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing:antialiased;
          position:relative;
          overflow-x:hidden;
        }
        a{color:inherit;text-decoration:none}

        /* HEADER */
        .site-header{
          position:sticky; top:0; z-index:40;
          background:var(--header-bg);
          border-bottom:1px solid var(--card-border);
          backdrop-filter:saturate(1.2) blur(10px);
        }
        .header-inner{
          max-width:1240px; margin:0 auto;
          padding:14px 24px;
          display:flex; align-items:center; justify-content:space-between;
          gap:16px;
        }
        .brand{
          display:flex; align-items:center; gap:12px;
          min-width:0;
        }
        .brand-mark{
          width:36px; height:36px; border-radius:10px;
          background:#111; color:#fff;
          display:grid; place-items:center;
          flex-shrink:0;
        }
        .is-dark .brand-mark{background:#f5f2ed; color:#111}
        .brand-text{line-height:1.1}
        .brand-text strong{
          font-family:"Instrument Serif", Georgia, serif;
          font-size:22px; font-weight:400; letter-spacing:-0.02em;
          display:block; white-space:nowrap;
        }
        .brand-text span{
          font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
          color:var(--muted); font-weight:600;
        }
        .nav-row{display:flex; align-items:center; gap:10px}
        .primary-nav{
          display:flex; gap:6px; align-items:center;
        }
        .nav-link{
          padding:8px 14px; border-radius:999px;
          font-size:14px; font-weight:500;
          color:var(--muted);
          transition:all .2s ease;
        }
        .nav-link:hover{background:rgba(0,0,0,0.06); color:var(--text)}
        .is-dark .nav-link:hover{background:rgba(255,255,255,0.08)}
        .nav-link.active{
          background:var(--text); color:var(--page-bg);
        }
        .is-dark .nav-link.active{background:#fff; color:#111}
        .icon-btn{
          width:38px; height:38px; border-radius:999px;
          border:1px solid var(--card-border);
          background:var(--page-bg);
          display:grid; place-items:center;
          cursor:pointer; transition:all .2s ease;
        }
        .icon-btn:hover{transform:translateY(-1px); box-shadow:var(--shadow-soft)}
        .hamburger{display:none}
        @media(max-width:820px){
          .primary-nav{
            position:fixed; left:16px; right:16px; top:64px;
            background:var(--page-bg);
            border:1px solid var(--card-border);
            border-radius:18px;
            padding:12px;
            flex-direction:column;
            align-items:stretch;
            box-shadow:var(--shadow-card);
            opacity:0; pointer-events:none; transform:translateY(-8px);
            transition:all .25s ease;
          }
          .primary-nav.open{opacity:1; pointer-events:auto; transform:translateY(0)}
          .hamburger{display:grid}
          .nav-row .icon-btn.dark-toggle{width:38px}
        }

        /* HERO */
        .page-shell{max-width:1240px; margin:0 auto; padding:0 24px 80px}
        .hero{
          position:relative;
          padding:64px 0 36px;
          text-align:center;
          overflow:hidden;
        }
        .hero-glow{
          position:absolute; inset:-10% 0 0 0;
          pointer-events:none;
          background:
            radial-gradient(600px 360px at 50% 0%, rgba(196,106,58,0.18), transparent 70%),
            radial-gradient(500px 300px at 20% 10%, rgba(232,160,122,0.22), transparent 60%),
            radial-gradient(500px 300px at 80% 10%, rgba(196,106,58,0.12), transparent 60%);
          z-index:0;
        }
        .hero-content{position:relative; z-index:1; max-width:720px; margin:0 auto}
        .check-wrap{
          width:92px; height:92px; margin:0 auto 24px;
          position:relative; display:grid; place-items:center;
        }
        .check-circle{
          width:92px; height:92px; border-radius:50%;
          background:#fff;
          border:1.5px solid rgba(196,106,58,0.25);
          box-shadow:0 0 0 12px rgba(196,106,58,0.08), 0 16px 32px rgba(196,106,58,0.18);
          display:grid; place-items:center;
          animation: scaleIn .7s cubic-bezier(.16,1,.3,1) both;
        }
        .is-dark .check-circle{background:#1e1e1e; border-color:rgba(196,106,58,0.35)}
        .check-circle svg{width:44px; height:44px}
        .check-path{
          stroke-dasharray: 100; stroke-dashoffset: 100;
          animation: drawCheck .7s .5s cubic-bezier(.16,1,.3,1) forwards;
        }
        .confetti{
          position:absolute; inset:-24px;
          pointer-events:none;
        }
        .confetti i{
          position:absolute; width:6px; height:6px; border-radius:50%;
          background:var(--accent);
          opacity:0;
          animation: confettiFall 1.2s ease-out forwards;
        }
        .hero-title{
          font-family:"Instrument Serif", Georgia, serif;
          font-size: clamp(44px, 7vw, 84px);
          line-height:0.95; letter-spacing:-0.03em; font-weight:400;
          margin:0 0 14px;
        }
        .hero-title em{font-style:italic; color:var(--accent)}
        .hero-sub{
          font-size: clamp(15px, 2.2vw, 18px);
          color:var(--muted);
          line-height:1.5; max-width:520px; margin:0 auto;
        }
        .hero-meta{
          margin-top:18px;
          display:inline-flex; gap:8px; align-items:center;
          background:var(--card-bg); border:1px solid var(--card-border);
          padding:8px 14px; border-radius:999px;
          font-size:13px; color:var(--muted);
        }
        .dot-pulse{
          width:8px; height:8px; border-radius:50%; background:#22c55e;
          box-shadow:0 0 0 0 rgba(34,197,94,0.5);
          animation: pulseDot 1.8s infinite;
        }

        /* CARD */
        .details-card{
          margin:8px auto 0; max-width:860px;
          background:var(--card-bg);
          border:1px solid var(--card-border);
          border-radius:var(--radius-xl);
          box-shadow:var(--shadow-card);
          overflow:hidden;
          animation: fadeUp .8s .15s both;
          position:relative;
        }
        .card-top{
          padding:26px 28px;
          border-bottom:1px solid var(--card-border);
          display:flex; justify-content:space-between; align-items:center; gap:16px;
          background:linear-gradient(180deg, rgba(255,255,255,0.6), rgba(0,0,0,0));
        }
        .is-dark .card-top{background:linear-gradient(180deg, rgba(255,255,255,0.04), transparent)}
        .card-top h2{
          font-family:"Instrument Serif", serif;
          font-size:28px; font-weight:400; letter-spacing:-0.02em; margin:0;
        }
        .card-top p{margin:4px 0 0; color:var(--muted); font-size:13px}
        .badge{
          padding:8px 12px; border-radius:999px;
          background:var(--page-bg); border:1px solid var(--card-border);
          font-size:12px; font-weight:600; letter-spacing:0.04em;
          display:inline-flex; align-items:center; gap:6px;
        }
        .card-body{padding:22px}
        .fields-grid{
          display:grid; grid-template-columns:1fr 1fr;
          gap:12px;
        }
        @media(max-width:700px){.fields-grid{grid-template-columns:1fr}}
        .field-row{
          background:var(--page-bg);
          border:1px solid var(--card-border);
          border-radius:14px;
          padding:14px 16px;
          display:flex; justify-content:space-between; gap:12px;
          transition:all .2s ease;
          position:relative;
        }
        .field-row:hover{border-color:rgba(196,106,58,0.35); transform:translateY(-1px)}
        .field-row.full{grid-column:1 / -1}
        .field-left{display:flex; gap:12px; min-width:0; align-items:flex-start}
        .field-icon{
          width:32px; height:32px; border-radius:9px;
          background:var(--card-bg); border:1px solid var(--card-border);
          display:grid; place-items:center; flex-shrink:0;
          color:var(--muted);
        }
        .field-meta{ min-width:0 }
        .field-label{
          font-size:11px; letter-spacing:0.12em; text-transform:uppercase;
          color:var(--muted); font-weight:700; margin-bottom:3px;
        }
        .field-value{
          font-size:14px; font-weight:500; line-height:1.35;
          word-break:break-word;
        }
        .field-value.muted{color:var(--muted); font-style:italic}
        .copy-hint{
          font-size:11px; color:var(--muted);
          opacity:0; transform:translateY(4px);
          transition:all .2s ease;
          position:absolute; right:12px; top:12px;
          background:var(--text); color:var(--page-bg);
          padding:4px 8px; border-radius:999px;
        }
        .field-row:hover .copy-hint{opacity:1; transform:translateY(0)}
        .copied-badge{
          position:absolute; right:12px; top:12px;
          background:var(--accent); color:#fff;
          padding:4px 8px; border-radius:999px; font-size:11px; font-weight:700;
          animation: fadeUp .25s ease;
        }

        .membership-row{
          margin-top:16px;
          padding:16px;
          border-radius:14px;
          border:1px dashed var(--card-border);
          display:flex; justify-content:space-between; gap:12px; align-items:center;
          background:linear-gradient(90deg, rgba(196,106,58,0.08), transparent);
        }
        .membership-row strong{font-size:14px}
        .membership-dot{width:10px; height:10px; border-radius:50%}

        /* NEXT STEPS */
        .next-section{
          max-width:860px; margin:28px auto 0;
          display:grid; gap:16px;
        }
        .next-header{text-align:center; margin:18px 0 6px}
        .next-header h3{
          font-family:"Instrument Serif", serif; font-size:32px; font-weight:400;
          margin:0 0 6px; letter-spacing:-0.02em;
        }
        .next-header p{color:var(--muted); font-size:14px; margin:0}
        .steps{
          display:grid; grid-template-columns:repeat(3,1fr); gap:14px;
        }
        @media(max-width:780px){.steps{grid-template-columns:1fr}}
        .step{
          background:var(--card-bg); border:1px solid var(--card-border);
          border-radius:18px; padding:18px 18px 16px;
          position:relative; overflow:hidden;
        }
        .step-num{
          width:28px; height:28px; border-radius:999px;
          background:var(--page-bg); border:1px solid var(--card-border);
          display:grid; place-items:center; font-size:12px; font-weight:700;
          margin-bottom:12px;
        }
        .step h4{margin:0 0 6px; font-size:15px; font-weight:600}
        .step p{margin:0; font-size:13px; line-height:1.5; color:var(--muted)}
        .step::after{
          content:""; position:absolute; top:-20px; right:-20px;
          width:80px; height:80px; border-radius:50%;
          background:radial-gradient(circle at 30% 30%, rgba(196,106,58,0.18), transparent 70%);
        }

        .cta-row{
          display:flex; gap:10px; justify-content:center; flex-wrap:wrap;
          margin-top:10px;
        }
        .btn{
          padding:13px 20px; border-radius:999px;
          font-size:14px; font-weight:600;
          border:1px solid transparent;
          cursor:pointer; transition:all .2s ease;
          display:inline-flex; align-items:center; gap:8px;
          text-decoration:none;
        }
        .btn-primary{
          background:var(--text); color:var(--page-bg);
        }
        .btn-primary:hover{transform:translateY(-1px); box-shadow:0 8px 20px rgba(0,0,0,0.15)}
        .btn-ghost{
          background:var(--card-bg); border-color:var(--card-border); color:var(--text);
        }
        .btn-ghost:hover{border-color:var(--text)}

        /* FOOTER */
        .site-footer{
          border-top:1px solid var(--card-border);
          background:var(--card-bg);
          margin-top:56px;
        }
        .footer-inner{
          max-width:1240px; margin:0 auto;
          padding:36px 24px;
          display:grid; grid-template-columns:1.2fr .8fr 1fr;
          gap:24px;
        }
        @media(max-width:900px){.footer-inner{grid-template-columns:1fr; gap:28px}}
        .footer-col h5{
          font-size:12px; letter-spacing:0.14em; text-transform:uppercase;
          margin:0 0 12px; color:var(--muted);
        }
        .footer-col p, .footer-col a{font-size:14px; line-height:1.6; color:var(--muted)}
        .footer-col strong{color:var(--text); font-weight:600}
        .socials{display:flex; gap:10px; margin-top:8px}
        .social{
          width:38px; height:38px; border-radius:50%;
          border:1px solid var(--card-border); background:var(--page-bg);
          display:grid; place-items:center; transition:all .2s ease;
        }
        .social:hover{transform:translateY(-2px); border-color:var(--text)}
        .footer-bottom{
          border-top:1px solid var(--card-border);
          padding:14px 24px;
          display:flex; justify-content:space-between; gap:12px; flex-wrap:wrap;
          font-size:12px; color:var(--muted);
          max-width:1240px; margin:0 auto;
        }

        /* ANIMATIONS */
        @keyframes scaleIn{
          0%{transform:scale(.6); opacity:0}
          60%{transform:scale(1.08)}
          100%{transform:scale(1); opacity:1}
        }
        @keyframes drawCheck{
          to{stroke-dashoffset:0}
        }
        @keyframes fadeUp{
          from{opacity:0; transform:translateY(16px)}
          to{opacity:1; transform:translateY(0)}
        }
        @keyframes pulseDot{
          0%{box-shadow:0 0 0 0 rgba(34,197,94,.6)}
          70%{box-shadow:0 0 0 10px rgba(34,197,94,0)}
          100%{box-shadow:0 0 0 0 rgba(34,197,94,0)}
        }
        @keyframes confettiFall{
          0%{transform:translateY(-10px) scale(.6) rotate(0deg); opacity:0}
          15%{opacity:1}
          100%{transform:translateY(38px) translateX(var(--x, 12px)) scale(1) rotate(180deg); opacity:0}
        }
        .fade-up{animation:fadeUp .7s cubic-bezier(.16,1,.3,1) both}
