        @import url('https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Playfair+Display:wght@600;700;800&display=swap');
        :root{
          --header-bg:#e5e5e5;
          --card-bg:#eeeeee;
          --card-border:#d8d8d8;
          --divider:#c9c9c9;
          --text:#111;
          --muted:#555;
          --btn-active:#bdbdbd;
          --paper:#f6f4ef;
          --white:#ffffff;
          --terracotta:#C46A3A;
          --terracotta-glow: rgba(196,106,58,0.22);
          --shadow: 0 10px 30px rgba(17,17,17,0.06), 0 2px 8px rgba(17,17,17,0.04);
          --shadow-lg: 0 18px 50px rgba(17,17,17,0.10), 0 6px 16px rgba(17,17,17,0.06);
        }
        .dark-root{
          --header-bg:#1f1f1f;
          --card-bg:#232323;
          --card-border:#333;
          --divider:#333;
          --text:#f2f2f2;
          --muted:#a0a0a0;
          --btn-active:#333;
          --paper:#121212;
          --white:#1c1c1c;
          --terracotta:#E58A5A;
          --terracotta-glow: rgba(229,138,90,0.28);
        }
        *{box-sizing:border-box}
        html,body{margin:0;padding:0}
        body{
          background:var(--paper);
          color:var(--text);
          font-family: Inter, system-ui, -apple-system, sans-serif;
          -webkit-font-smoothing:antialiased;
        }
        .serif{font-family:"Playfair Display", Georgia, serif}
        .container{max-width:1180px;margin:0 auto;padding:0 20px}
        /* Header */
        header{
          position:sticky;top:0;z-index:50;
          background:var(--header-bg);
          border-bottom:1px solid var(--divider);
          backdrop-filter: saturate(1.2) blur(6px);
        }
        .header-inner{
          display:flex;align-items:center;justify-content:space-between;
          height:64px;
        }
        .brand{display:flex;align-items:center;gap:12px;font-weight:700;letter-spacing:-0.02em}
        .brand-mark{
          width:34px;height:34px;border-radius:9px;
          background:var(--text);color:var(--header-bg);
          display:grid;place-items:center;
        }
        .nav{
          display:flex;align-items:center;gap:28px;
        }
        .nav a{
          text-decoration:none;color:var(--muted);font-weight:500;font-size:14px;
          padding:6px 2px;position:relative;letter-spacing:-0.01em;
          transition:color .2s;
        }
        .nav a.active{color:var(--text);font-weight:700}
        .nav a.active:after{
          content:"";position:absolute;left:0;right:0;bottom:-2px;height:2px;background:var(--text);border-radius:2px;
        }
        .nav a:hover{color:var(--text)}
        .icon-btn{
          width:36px;height:36px;border-radius:999px;border:1px solid var(--card-border);
          background:var(--card-bg);display:grid;place-items:center;cursor:pointer;
          transition:all .2s;
        }
        .icon-btn:hover{background:var(--btn-active)}
        .hamburger{display:none}
        @media(max-width:860px){
          .nav{display:none}
          .nav.open{
            display:flex;flex-direction:column;align-items:flex-start;
            position:absolute;top:64px;left:0;right:0;
            background:var(--header-bg);border-bottom:1px solid var(--divider);
            padding:18px 20px;gap:18px;
          }
          .hamburger{display:grid}
        }

        /* Page head */
        .page-head{padding:46px 0 18px;border-bottom:1px solid var(--divider);margin-bottom:28px}
        .page-head h1{
          font-size: clamp(36px, 6vw, 64px);
          line-height:0.95;letter-spacing:-0.04em;margin:0 0 12px;
          font-weight:800;
        }
        .page-head p{margin:0;color:var(--muted);font-size:16px;max-width:560px;line-height:1.5}

        /* Layout */
        .join-grid{
          display:grid;grid-template-columns:1.6fr 1fr;gap:28px;align-items:start;
          padding-bottom:80px;
        }
        @media(max-width:980px){.join-grid{grid-template-columns:1fr}}

        /* Form card */
        .form-card{
          background:var(--white);
          border:1px solid var(--card-border);
          border-radius:16px;
          box-shadow:var(--shadow);
          padding:28px;
          position:relative;
          overflow:hidden;
        }
        .form-card:before{
          content:"";position:absolute;top:0;left:0;right:0;height:1px;
          background:linear-gradient(90deg, transparent, var(--divider), transparent);
        }
        .form-section-title{
          font-family:"Playfair Display",serif;
          font-size:20px;font-weight:700;margin:0 0 18px;letter-spacing:-0.02em;
        }
        .fields{display:grid;gap:18px}
        .field-row{display:grid;grid-template-columns:1fr 1fr;gap:18px}
        @media(max-width:600px){.field-row{grid-template-columns:1fr}}
        label.field{
          display:flex;flex-direction:column;gap:8px;
          font-size:13px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;
          color:var(--text);
        }
        label.field span.req{color:var(--terracotta);margin-left:4px;text-transform:none;font-weight:600}
        label.field input,
        label.field select,
        label.field textarea{
          font-family:Inter, sans-serif;
          font-weight:400;font-size:15px;letter-spacing:0;text-transform:none;
          padding:12px 14px;
          border:1px solid var(--card-border);
          border-radius:12px;
          background:var(--paper);
          color:var(--text);
          outline:none;
          transition: border-color .2s, box-shadow .2s, background .2s;
        }
        label.field textarea{resize:vertical;min-height:112px;line-height:1.5}
        label.field input:focus,
        label.field select:focus,
        label.field textarea:focus{
          border-color:var(--terracotta);
          box-shadow:0 0 0 4px var(--terracotta-glow);
          background:var(--white);
        }
        .membership-fieldset{
          border:1px dashed var(--card-border);border-radius:12px;padding:16px;
          display:grid;gap:10px;
        }
        .membership-fieldset legend{
          font-size:12px;letter-spacing:0.08em;text-transform:uppercase;font-weight:700;
          padding:0 8px;color:var(--muted);
        }
        .radio{
          display:flex;align-items:flex-start;gap:12px;
          padding:12px 14px;border:1px solid var(--card-border);border-radius:10px;
          background:var(--paper);cursor:pointer;transition:all .2s;
          text-transform:none;letter-spacing:0;font-weight:500;font-size:14px;
        }
        .radio:hover{border-color:var(--text);background:var(--white)}
        .radio:has(input:checked){
          border-color:var(--terracotta);background:var(--white);
          box-shadow:0 0 0 3px var(--terracotta-glow);
        }
        .radio input{accent-color:var(--terracotta);margin-top:2px}
        .radio strong{display:block;font-weight:700;letter-spacing:-0.01em}
        .radio small{display:block;color:var(--muted);font-weight:400;margin-top:2px}

        .submit-row{margin-top:8px;display:flex;gap:12px;align-items:center}
        input[type="submit"]{
          appearance:none;border:none;cursor:pointer;
          background:var(--text);color:var(--paper);
          padding:14px 22px;border-radius:999px;
          font-weight:700;font-size:14px;letter-spacing:0.02em;
          transition:transform .15s, opacity .2s, box-shadow .2s;
          box-shadow:0 8px 20px rgba(0,0,0,0.15);
        }
        input[type="submit"]:hover{transform:translateY(-1px);box-shadow:0 12px 28px rgba(0,0,0,0.18)}
        input[type="submit"]:active{transform:translateY(0px)}
        .hint{font-size:12px;color:var(--muted);font-weight:400;text-transform:none;letter-spacing:0}

        /* Membership cards column */
        .cards-col{display:grid;gap:16px;position:sticky;top:84px}
        @media(max-width:980px){.cards-col{position:static}}
        .member-card{
          background:var(--card-bg);
          border:1px solid var(--card-border);
          border-radius:14px;
          padding:18px 18px 16px;
          box-shadow:var(--shadow);
          position:relative;overflow:hidden;
          transform:translateY(0);
          animation: fadeUp .7s cubic-bezier(.2,.8,.2,1) both, borderGlow 1.6s ease .6s both;
        }
        .member-card:nth-child(1){animation-delay:.05s,.7s}
        .member-card:nth-child(2){animation-delay:.15s,.8s}
        .member-card:nth-child(3){animation-delay:.25s,.9s}
        .member-card:nth-child(4){animation-delay:.35s,1s}
        .member-card.gold{
          background: linear-gradient(180deg, var(--card-bg), var(--card-bg)), radial-gradient(120% 120% at 0% 0%, rgba(197,160,89,0.18), transparent 50%);
          border-color:#c9b48a;
        }
        .member-card.gold:after{
          content:"";position:absolute;top:-50%;left:-50%;width:200%;height:200%;
          background: linear-gradient(100deg, transparent 40%, rgba(255,255,255,0.55) 50%, transparent 60%);
          transform:translateX(-100%) rotate(12deg);
          animation: shimmer 2.8s ease 1.2s infinite;
          pointer-events:none;
        }
        .member-card:hover{transform:translateY(-2px);box-shadow:var(--shadow-lg)}
        .card-top{display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px}
        .card-title{font-family:"Playfair Display",serif;font-size:18px;font-weight:700;letter-spacing:-0.02em;margin:0}
        .price{font-size:12px;font-weight:700;letter-spacing:0.06em;text-transform:uppercase;padding:6px 10px;border-radius:999px;background:var(--white);border:1px solid var(--card-border)}
        .member-card.gold .price{background:#111;color:#f5e6c8;border-color:#111}
        .muted{color:var(--muted);font-size:13px;line-height:1.4;margin:0 0 14px}
        .view-benefits{
          appearance:none;border:1px solid var(--card-border);background:var(--white);
          border-radius:999px;padding:8px 14px;font-size:13px;font-weight:600;cursor:pointer;
          transition:all .2s;
        }
        .view-benefits:hover{background:var(--text);color:var(--paper);border-color:var(--text)}
        .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:6px;vertical-align:middle}

        /* Modals */
        .modal-backdrop{
          position:fixed;inset:0;background:rgba(17,17,17,0.38);backdrop-filter:blur(10px) saturate(1.2);
          display:grid;place-items:center;padding:20px;z-index:100;
          animation: backdropIn .25s ease;
        }
        .modal{
          width:100%;max-width:520px;background:var(--white);border:1px solid var(--card-border);
          border-radius:20px;box-shadow:0 30px 80px rgba(0,0,0,0.25);
          padding:26px;position:relative;
          animation: modalIn .35s cubic-bezier(.2,.8,.2,1);
        }
        .modal h3{font-family:"Playfair Display",serif;font-size:26px;margin:0 0 6px;letter-spacing:-0.03em}
        .modal .sub{color:var(--muted);font-size:13px;margin:0 0 18px}
        .benefits{list-style:none;padding:0;margin:0;display:grid;gap:10px}
        .benefits li{
          display:flex;gap:10px;align-items:flex-start;
          font-size:14px;line-height:1.45;background:var(--paper);border:1px solid var(--card-border);
          border-radius:12px;padding:11px 12px;
        }
        .benefits li i{width:22px;height:22px;border-radius:999px;background:var(--text);color:var(--paper);display:grid;place-items:center;font-style:normal;font-size:12px;flex:0 0 22px;margin-top:1px}
        .close-x{
          position:absolute;top:12px;right:12px;width:36px;height:36px;border-radius:999px;
          border:1px solid var(--card-border);background:var(--paper);display:grid;place-items:center;cursor:pointer;
        }
        .close-x:hover{background:var(--card-bg)}

        /* Footer */
        footer{border-top:1px solid var(--divider);background:var(--header-bg);padding:36px 0 28px;margin-top:20px}
        .footer-grid{display:grid;grid-template-columns:1.2fr .8fr 1fr;gap:24px}
        @media(max-width:860px){.footer-grid{grid-template-columns:1fr;gap:20px}}
        .footer-title{font-weight:700;font-size:14px;margin:0 0 8px}
        .footer-text{font-size:13px;color:var(--muted);line-height:1.6;margin:0}
        .socials{display:flex;gap:10px;margin-top:12px}
        .social{width:36px;height:36px;border-radius:999px;border:1px solid var(--card-border);background:var(--card-bg);display:grid;place-items:center;cursor:pointer}
        .small{font-size:12px;color:var(--muted);line-height:1.5}

        /* Animations */
        @keyframes fadeUp{
          from{opacity:0;transform:translateY(18px)}
          to{opacity:1;transform:translateY(0)}
        }
        @keyframes borderGlow{
          0%{border-color:var(--card-border)}
          50%{border-color:var(--terracotta)}
          100%{border-color:var(--card-border)}
        }
        @keyframes shimmer{
          0%{transform:translateX(-100%) rotate(12deg)}
          70%,100%{transform:translateX(100%) rotate(12deg)}
        }
        @keyframes backdropIn{from{opacity:0}to{opacity:1}}
        @keyframes modalIn{from{opacity:0;transform:translateY(12px) scale(.98)}to{opacity:1;transform:translateY(0) scale(1)}}

        /* Thankyou preview banner */
        .thanks-banner{
          background:var(--text);color:var(--paper);border-radius:16px;padding:18px 20px;
          display:grid;gap:6px;margin-bottom:22px;animation:fadeUp .5s ease;
        }
        .thanks-banner h2{margin:0;font-family:"Playfair Display",serif;font-size:20px;letter-spacing:-0.02em}
        .thanks-grid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-top:10px}
        @media(max-width:600px){.thanks-grid{grid-template-columns:1fr}}
        .thanks-item{background:rgba(255,255,255,0.08);border:1px solid rgba(255,255,255,0.14);border-radius:10px;padding:10px 12px;font-size:13px}
        .thanks-item b{display:block;font-size:11px;letter-spacing:0.08em;text-transform:uppercase;opacity:.7;margin-bottom:2px}
